# Load-test topology: scales the app and adds a k6 runner hitting /webhook.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.load.yml up -d postgres redis app
#   docker compose -f docker-compose.yml -f docker-compose.load.yml run --rm k6

services:
  app:
    deploy:
      replicas: 3
    environment:
      RATE_LIMIT_PER_MINUTE: 6000