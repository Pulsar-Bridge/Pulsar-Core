[package]
name = "pulsar-core"
version = "0.1.0"
edition = "2021"
description = "Rust off-chain relay for Pulsar Bridge"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util", "limit"] }
tower-http = { version = "0.5", features = ["trace", "timeout", "request-id"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate", "bigdecimal"] }
bigdecimal = { version = "0.3", features = ["serde"] }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

thiserror = "1"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

governor = "0.6"