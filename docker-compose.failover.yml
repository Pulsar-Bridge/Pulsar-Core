# Adds a streaming-replication standby and a second app instance pointed at
# it via .env.example.failover, so failover behavior (the app's DB pool
# reconnecting, the circuit breaker tripping on a degraded primary) can be
# exercised locally. This is a minimal example for local testing, not a
# production failover solution — a real deployment needs an orchestrator
# (e.g. Patroni) to handle actual promotion; this compose file does not
# automate promotion.

services:
  postgres:
    command: >
      postgres -c wal_level=replica -c max_wal_senders=5
               -c max_replication_slots=5 -c hot_standby=on

  postgres-replica:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: replicator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    entrypoint:
      - bash
      - -c
      - |
        set -e
        until pg_basebackup -h postgres -U ${POSTGRES_USER:-postgres} -D /var/lib/postgresql/data -Fp -Xs -P -R; do
          sleep 2
        done
        exec postgres
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app-failover:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.example.failover
    ports:
      - "8081:8080"
    depends_on:
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy