openapi: 3.0.3
info:
  title: pulsar-core relay API
  version: 0.1.0
  description: >
    Tracks exactly what's implemented and merged in src/handlers — see
    CONTRIBUTING.md's PR checklist item requiring this file to be updated in
    the same PR that ships an endpoint, not as a follow-up.
servers:
  - url: http://localhost:8080
paths:
  /webhook:
    post:
      summary: Stellar Anchor Platform deposit callback
      security:
        - tenantApiKey: []
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPayload'
      responses:
        '200':
          description: Idempotent replay of a previously processed deposit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '201':
          description: Deposit accepted and processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Missing idempotency key or invalid payload
        '429':
          description: Duplicate concurrent request, or rate limited
        '502':
          description: Upstream Horizon/contract call failed
        '503':
          description: Circuit breaker open

  /admin/tenants/{tenant_id}/transactions:
    get:
      summary: List a tenant's deposit transactions
      security:
        - adminApiKey: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 500
      responses:
        '200':
          description: Transactions for the tenant, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

  /healthz:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Process is up

  /readyz:
    get:
      summary: Readiness probe (DB, Redis, Horizon/contract circuit state)
      responses:
        '200':
          description: Ready to serve traffic
        '503':
          description: A dependency is unavailable

  /metrics:
    get:
      summary: Prometheus text-format metrics
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    tenantApiKey:
      type: http
      scheme: bearer
    adminApiKey:
      type: http
      scheme: bearer
  schemas:
    WebhookPayload:
      type: object
      required: [external_deposit_id, amount, asset_code, stellar_account]
      properties:
        external_deposit_id:
          type: string
        amount:
          type: string
          description: Decimal string, e.g. "10.5000000"
        asset_code:
          type: string
        stellar_account:
          type: string
          description: Stellar public key (G...), 56 characters
    WebhookResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, submitted, confirmed, failed]
        contract_tx_hash:
          type: string
          nullable: true
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        external_deposit_id:
          type: string
          nullable: true
        status:
          type: string
        amount:
          type: string
        asset_code:
          type: string
        stellar_account:
          type: string
        contract_tx_hash:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
